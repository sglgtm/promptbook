name: Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/ssh-diagnose.yml'
      - '.github/workflows/find-project.yml'
      - 'supabase/**'
      - '01_concept/**'
      - '02_ux/**'
      - '03_ui/**'
      - '04_wireframes/**'
      - '05_validation/**'

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy on VPS via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: SSH prep
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${SSH_HOST}"
          echo "::add-mask::${SSH_USER}"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "$HOME/.ssh/id_key"
          chmod 600 "$HOME/.ssh/id_key"
          : > "$HOME/.ssh/known_hosts"
          ssh-keyscan -T 10 -p "${SSH_PORT:-22}" -t ed25519,ecdsa,rsa "${SSH_HOST}" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${SSH_HOST}"
          echo "::add-mask::${SSH_USER}"
          echo "::add-mask::${DEPLOY_PATH}"
          ssh -i "$HOME/.ssh/id_key" -p "$PORT" \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o StrictHostKeyChecking=yes -o BatchMode=yes -o LogLevel=ERROR \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "${SSH_USER}@${SSH_HOST}" \
              "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" < scripts/remote-deploy.sh

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/id_key" "$HOME/.ssh/known_hosts"
