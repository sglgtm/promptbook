name: Server Provision (one-time)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Введи "PROVISION", чтобы подтвердить установку'
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: server-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Install Node/nginx/pm2 and prepare /var/www/promptbook
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Guard
        if: ${{ github.event.inputs.confirm != 'PROVISION' }}
        run: |
          echo "::error::confirm=='${{ github.event.inputs.confirm }}' (ожидается PROVISION)"
          exit 1

      - name: Prepare SSH context
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret ${var} is empty"; missing=$((missing+1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "::add-mask::${SSH_HOST}"
          echo "::add-mask::${SSH_USER}"

          umask 077
          mkdir -p "${HOME}/.ssh"
          KEY_FILE="${HOME}/.ssh/id_promptbook_deploy"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"

          PORT="${SSH_PORT:-22}"
          KNOWN="${HOME}/.ssh/known_hosts"; : > "${KNOWN}"
          if ! ssh-keyscan -T 10 -p "${PORT}" -t ed25519,ecdsa,rsa "${SSH_HOST}" >> "${KNOWN}" 2>/dev/null; then
            echo "::error::ssh-keyscan failed"; exit 1
          fi
          chmod 600 "${KNOWN}"

          {
            echo "PB_PORT=${PORT}"
            echo "PB_KEY=${KEY_FILE}"
            echo "PB_KNOWN=${KNOWN}"
          } >> "$GITHUB_ENV"

      - name: Run provisioning on remote
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${SSH_HOST}"
          echo "::add-mask::${SSH_USER}"
          echo "::add-mask::${DEPLOY_PATH}"

          SSH_OPTS=(
            -i "${PB_KEY}"
            -p "${PB_PORT}"
            -o UserKnownHostsFile="${PB_KNOWN}"
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=2
            -o LogLevel=ERROR
          )

          # Идемпотентный provisioning: только apt-install + mkdir + git clone.
          # Никаких systemctl restart nginx/PATH-hacks/reboot. Всё тихо.
          REMOTE=$(cat <<'REMOTE_SCRIPT'
set -euo pipefail
export DEBIAN_FRONTEND=noninteractive
export NEEDRESTART_MODE=a

DEPLOY_PATH_LOCAL="${DEPLOY_PATH:-/var/www/promptbook}"
REPO_URL="https://github.com/sglgtm/promptbook.git"

echo "===== 1. apt update ====="
sudo -n apt-get update -qq

echo "===== 2. Base packages ====="
sudo -n apt-get install -y -qq curl git ca-certificates gnupg nginx ufw >/dev/null

echo "===== 3. Node 20 (nodesource) ====="
if ! command -v node >/dev/null 2>&1 || ! node -v | grep -q '^v20\.'; then
  curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -n -E bash - >/dev/null
  sudo -n apt-get install -y -qq nodejs >/dev/null
fi

echo "===== 4. pm2 ====="
if ! command -v pm2 >/dev/null 2>&1; then
  sudo -n npm install -g pm2 >/dev/null
fi

echo "===== 5. Deploy path ====="
sudo -n mkdir -p "$DEPLOY_PATH_LOCAL"
sudo -n chown "$USER:$USER" "$DEPLOY_PATH_LOCAL"

echo "===== 6. Clone or update repo ====="
if [ ! -d "$DEPLOY_PATH_LOCAL/.git" ]; then
  # Клон только если папка пуста; иначе не трогаем.
  if [ -z "$(ls -A "$DEPLOY_PATH_LOCAL" 2>/dev/null || true)" ]; then
    git clone --depth 1 "$REPO_URL" "$DEPLOY_PATH_LOCAL"
  else
    echo "warn: $DEPLOY_PATH_LOCAL не пуст, git clone пропущен"
  fi
else
  git -C "$DEPLOY_PATH_LOCAL" fetch --depth 1 origin main
  git -C "$DEPLOY_PATH_LOCAL" reset --hard origin/main
fi

echo "===== 7. .env.local stub (без секретов) ====="
ENV_FILE="$DEPLOY_PATH_LOCAL/.env.local"
if [ ! -f "$ENV_FILE" ]; then
  cat > "$ENV_FILE" <<'ENV'
# Заполнить вручную на сервере, никогда не в git.
NEXT_PUBLIC_SUPABASE_URL=
NEXT_PUBLIC_SUPABASE_ANON_KEY=
PERPLEXITY_API_KEY=
ENV
  chmod 600 "$ENV_FILE"
  echo "created empty $ENV_FILE (владелец $USER, chmod 600)"
else
  echo "$ENV_FILE уже существует — не трогаем"
fi

echo "===== 8. Установленные версии ====="
printf "node:  %s\n" "$(node -v 2>/dev/null || echo none)"
printf "npm:   %s\n" "$(npm -v 2>/dev/null || echo none)"
printf "nginx: %s\n" "$(nginx -v 2>&1 || echo none)"
printf "pm2:   %s\n" "$(pm2 -v 2>/dev/null || echo none)"

echo "===== 9. Listing deploy path (top-level) ====="
ls -la --group-directories-first --time-style=long-iso "$DEPLOY_PATH_LOCAL" | head -30

echo "===== END ====="
REMOTE_SCRIPT
)

          # Передаём DEPLOY_PATH внутрь удалённой сессии через переменную окружения.
          # SendEnv/AcceptEnv может быть не разрешён на sshd — надёжнее inline.
          if ! ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" \
               "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" <<< "${REMOTE}"; then
            echo "::error::Provisioning failed"
            exit 1
          fi

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          [ -f "${PB_KEY:-}" ] && (shred -u "${PB_KEY}" 2>/dev/null || rm -f "${PB_KEY}") || true
          [ -f "${PB_KNOWN:-}" ] && rm -f "${PB_KNOWN}" || true
          echo "SSH artefacts removed."
