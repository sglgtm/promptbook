name: Server Provision (one-time)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Введи PROVISION, чтобы подтвердить'
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: server-provision
  cancel-in-progress: false

jobs:
  provision:
    name: Install Node/nginx/pm2 and prepare deploy path
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (для scripts/remote-provision.sh)
        uses: actions/checkout@v4

      - name: Guard
        if: ${{ github.event.inputs.confirm != 'PROVISION' }}
        run: |
          echo "::error::confirm=='${{ github.event.inputs.confirm }}' (ожидается PROVISION)"
          exit 1

      - name: Prepare SSH context
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Secret ${var} is empty"; missing=$((missing+1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "::add-mask::${SSH_HOST}"
          echo "::add-mask::${SSH_USER}"

          umask 077
          mkdir -p "${HOME}/.ssh"
          KEY_FILE="${HOME}/.ssh/id_promptbook_deploy"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"

          PORT="${SSH_PORT:-22}"
          KNOWN="${HOME}/.ssh/known_hosts"; : > "${KNOWN}"
          if ! ssh-keyscan -T 10 -p "${PORT}" -t ed25519,ecdsa,rsa "${SSH_HOST}" >> "${KNOWN}" 2>/dev/null; then
            echo "::error::ssh-keyscan failed"; exit 1
          fi
          chmod 600 "${KNOWN}"

          echo "PB_PORT=${PORT}"   >> "$GITHUB_ENV"
          echo "PB_KEY=${KEY_FILE}" >> "$GITHUB_ENV"
          echo "PB_KNOWN=${KNOWN}"  >> "$GITHUB_ENV"

      - name: Run provisioning on remote
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${SSH_HOST}"
          echo "::add-mask::${SSH_USER}"
          echo "::add-mask::${DEPLOY_PATH}"

          ssh -i "${PB_KEY}" -p "${PB_PORT}" \
              -o UserKnownHostsFile="${PB_KNOWN}" \
              -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ConnectTimeout=15 -o LogLevel=ERROR \
              "${SSH_USER}@${SSH_HOST}" \
              "DEPLOY_PATH='${DEPLOY_PATH}' bash -s" \
              < scripts/remote-provision.sh

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          [ -f "${PB_KEY:-}" ] && (shred -u "${PB_KEY}" 2>/dev/null || rm -f "${PB_KEY}") || true
          [ -f "${PB_KNOWN:-}" ] && rm -f "${PB_KNOWN}" || true
          echo "SSH artefacts removed."
